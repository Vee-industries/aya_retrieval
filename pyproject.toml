[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aya-retrieval"
version = "0.1.0"
description = "Training Tiny Aya to search a long chat for facts that are out of view, and only then."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Vaillancourt" }]
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.*",
    "transformers>=5.15",
    "huggingface_hub>=1.4",
    "safetensors>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Kept exactly as used, as a record (R-039): not reformatted.
extend-exclude = ["docs/independent_pool"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A"]
