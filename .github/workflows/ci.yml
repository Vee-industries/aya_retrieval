# Lint and tests on CPU, with the two Lexsi toolkits pinned to the commits every result was made with.
# No model weights are downloaded. The checkout layout matches the local one (repo beside ../vendor), so
# provenance reads the toolkit commits the same way it does on the machine that made the results.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A read token with "read access to public gated repos", added by the repo owner as a secret. Without
      # it, the tokenizer-only tests cannot fetch Tiny Aya's gated tokenizer (see the last two steps).
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    defaults:
      run:
        working-directory: aya_retrieval
    steps:
      - uses: actions/checkout@v4
        with:
          path: aya_retrieval
      - uses: actions/checkout@v4
        with:
          repository: Lexsi-Labs/AgentTune
          ref: d4db4c12d52342227c4113a70183d0f64aa2f345
          path: vendor/AgentTune
          # setuptools_scm needs the tags to give AgentTune its recorded version (1.1.3).
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Lexsi-Labs/AuditKIT
          ref: 71316da345784ff220d5ed59337441a59ab31526
          path: vendor/AuditKIT
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aya_retrieval/pyproject.toml

      - name: Install (CPU torch; the versions every result was made with)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          # AgentTune declares many heavy optional dependencies this project never imports.
          python -m pip install --no-deps ../vendor/AgentTune ../vendor/AuditKIT
          python -m pip install transformers==5.22.1 peft==0.21.2 trl==1.7.1 accelerate==1.15.0 \
            huggingface_hub==1.33.0 safetensors==0.8.0 datasets==5.1.0 \
            langchain-text-splitters==1.1.3 psutil==7.2.2 pyyaml==6.0.3 ruff==0.17.3 pytest==9.2.0
          python -m pip install -e . --no-deps

      - name: Import check
        run: python -c "import aya_retrieval.harness, aya_retrieval.scoring, aya_retrieval.recall_tool, aya_retrieval.audit, aya_retrieval.chat"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Fetch the tokenizer (needs the HF_TOKEN secret)
        if: env.HF_TOKEN != ''
        run: |
          python -c "from huggingface_hub import snapshot_download; from aya_retrieval.models import MODEL_ID, MODEL_REVISION; snapshot_download(MODEL_ID, revision=MODEL_REVISION, allow_patterns=['tokenizer*', 'special_tokens_map.json', 'config.json', 'generation_config.json'])"

      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python -m pytest -ra
          else
            # tests/test_inference.py loads Tiny Aya's gated tokenizer and has no skip; it runs only with the
            # secret. The tokenizer tests in tests/test_loss_masks.py skip themselves without it.
            echo "HF_TOKEN not set: leaving out tests/test_inference.py (needs the gated tokenizer)"
            python -m pytest -ra --ignore=tests/test_inference.py
          fi
